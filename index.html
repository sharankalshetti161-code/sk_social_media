<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#fafafa;
  color:#111;
  padding-bottom:65px;
}

header{
  height:60px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

header button{
  border:0;
  background:none;
  font-size:25px;
}

.stories{
  display:flex;
  gap:15px;
  padding:14px;
  background:white;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

.story{
  min-width:65px;
  text-align:center;
  font-size:12px;
}

.story-img{
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);
  padding:3px;
  margin:auto;
}

.story-img div{
  width:100%;
  height:100%;
  background:#ddd;
  border-radius:50%;
}

.post{
  background:white;
  margin:15px 0;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
}

.post-head{
  display:flex;
  align-items:center;
  padding:12px;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ddd;
}

.post-img{
  width:100%;
  height:330px;
  background:linear-gradient(135deg,#222,#777);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:30px;
}

.actions{
  padding:10px;
  display:flex;
  gap:18px;
  font-size:25px;
}

.actions button{
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.likes{
  padding:0 12px;
  font-weight:bold;
}

.caption{
  padding:8px 12px 15px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  border:0;
  background:none;
  font-size:25px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.profile{
  background:white;
  padding:25px;
  text-align:center;
}

.profile-img{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ccc;
  margin:auto;
}

.profile h2{
  margin:12px;
}

.search{
  padding:15px;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SK Social</div>
  <button onclick="alert('Messages')">✈️</button>
</header>

<!-- HOME -->
<div id="home" class="page active">

<div class="stories">

<div class="story">
<div class="story-img"><div></div></div>
You
</div>

<div class="story">
<div class="story-img"><div></div></div>
Friend
</div>

<div class="story">
<div class="story-img"><div></div></div>
Rahul
</div>

<div class="story">
<div class="story-img"><div></div></div>
Amit
</div>

<div class="story">
<div class="story-img"><div></div></div>
Neha
</div>

</div>

<div class="post">

<div class="post-head">
<div class="avatar"></div>
<b>sk_social</b>
</div>

<div class="post-img">
SK SOCIAL
</div>

<div class="actions">
<button onclick="likePost()">♡</button>
<button onclick="comment()">💬</button>
<button onclick="sharePost()">➤</button>
</div>

<div class="likes">
<span id="likes">0</span> likes
</div>

<div class="caption">
<b>sk_social</b> Welcome to SK Social 🚀
</div>

</div>

</div>


<!-- SEARCH -->

<div id="search" class="page">

<div class="search">
<input type="text" placeholder="Search">
</div>

</div>


<!-- CREATE -->

<div id="create" class="page">

<div style="padding:30px;text-align:center;background:white">

<h2>Create Post</h2>

<br>

<input type="file" accept="image/*" onchange="previewImage(event)">

<br><br>

<img id="preview"
style="max-width:100%;display:none;border-radius:10px;">

</div>

</div>


<!-- PROFILE -->

<div id="profile" class="page">

<div class="profile">

<div class="profile-img"></div>

<h2>SK Social</h2>

<p>@sk_social</p>

<br>

<b>0</b> Posts &nbsp;&nbsp;
<b>0</b> Followers &nbsp;&nbsp;
<b>0</b> Following

<br><br>

<button onclick="alert('Edit Profile')">
Edit Profile
</button>

</div>

</div>


<!-- BOTTOM NAVIGATION -->

<div class="bottom">

<button onclick="showPage('home')">⌂</button>

<button onclick="showPage('search')">🔍</button>

<button onclick="showPage('create')">＋</button>

<button onclick="alert('Reels')">▶</button>

<button onclick="showPage('profile')">👤</button>

</div>


<script>

let likes = 0;

function likePost(){

likes++;

document.getElementById("likes").innerText = likes;

}

function comment(){

let c = prompt("Write a comment:");

if(c){

alert("Comment added: " + c);

}

}

function sharePost(){

alert("Post shared!");

}

function showPage(page){

document.querySelectorAll(".page").forEach(function(p){

p.classList.remove("active");

});

document.getElementById(page).classList.add("active");

}

function previewImage(event){

let image = document.getElementById("preview");

image.src = URL.createObjectURL(event.target.files[0]);

image.style.display = "block";

}

</script>

</body>
</html>
