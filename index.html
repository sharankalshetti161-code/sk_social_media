
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SK Shooting 3D</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{position:fixed;inset:0}
#ui{
  position:fixed;
  top:12px;
  left:12px;
  color:white;
  font-size:18px;
  font-weight:bold;
  z-index:5;
  text-shadow:2px 2px 3px #000;
}
#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:30px;
  z-index:4;
}
#shoot{
  position:fixed;
  right:25px;
  bottom:35px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid white;
  background:rgba(220,30,30,.75);
  color:white;
  font-size:18px;
  font-weight:bold;
  z-index:6;
}
#left,#right,#forward,#back{
  position:fixed;
  width:55px;
  height:55px;
  border-radius:15px;
  border:2px solid white;
  background:rgba(0,0,0,.45);
  color:white;
  font-size:25px;
  z-index:6;
}
#forward{left:80px;bottom:135px}
#left{left:20px;bottom:75px}
#back{left:80px;bottom:15px}
#right{left:140px;bottom:75px}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  color:white;
  z-index:20;
  text-align:center;
  padding-top:30vh;
}
#gameover h1{font-size:42px}
#restart{
  padding:15px 30px;
  font-size:20px;
  border:0;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">
  ❤️ Health: <span id="health">100</span><br>
  🏆 Score: <span id="score">0</span>
</div>

<div id="crosshair">+</div>

<button id="forward">▲</button>
<button id="left">◀</button>
<button id="back">▼</button>
<button id="right">▶</button>
<button id="shoot">FIRE</button>

<div id="gameover">
  <h1>SK SHOOTING</h1>
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <button id="restart">RESTART</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;
let player;
let enemies=[];
let bullets=[];
let health=100;
let score=0;
let gameRunning=true;

const keys={
  forward:false,
  back:false,
  left:false,
  right:false
};

/* ---------------- SCENE ---------------- */

scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

camera=new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  0.1,
  1000
);

camera.position.set(0,2,8);

renderer=new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;

document.getElementById("game").appendChild(renderer.domElement);

/* ---------------- LIGHT ---------------- */

const sunlight=new THREE.DirectionalLight(0xffffff,1.5);
sunlight.position.set(10,20,10);
sunlight.castShadow=true;
scene.add(sunlight);

scene.add(new THREE.AmbientLight(0xffffff,.5));

/* ---------------- GROUND ---------------- */

const groundGeometry=new THREE.PlaneGeometry(200,200);

const groundMaterial=new THREE.MeshStandardMaterial({
  color:0x3b7d3b
});

const ground=new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* ---------------- PLAYER ---------------- */

player=new THREE.Group();

const body=new THREE.Mesh(
  new THREE.BoxGeometry(1,1.5,.7),
  new THREE.MeshStandardMaterial({color:0x2266cc})
);

body.position.y=1.3;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(.42,16,16),
  new THREE.MeshStandardMaterial({color:0xffc49b})
);

head.position.y=2.35;
head.castShadow=true;
player.add(head);

/* gun */

const gun=new THREE.Mesh(
  new THREE.BoxGeometry(.18,.18,1.2),
  new THREE.MeshStandardMaterial({color:0x222222})
);

gun.position.set(.45,1.45,-.65);
gun.rotation.x=-0.05;
player.add(gun);

player.position.set(0,0,8);
scene.add(player);

/* ---------------- MAP OBJECTS ---------------- */

function createBox(x,z,w,h,d,color){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:color})
  );

  mesh.position.set(x,h/2,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);
}

createBox(-8,-10,3,4,3,0x777777);
createBox(8,-15,4,5,4,0x777777);
createBox(-12,8,4,3,4,0x8b4513);
createBox(12,5,4,4,4,0x8b4513);
createBox(0,-25,8,5,3,0x666666);

/* ---------------- ENEMY ---------------- */

function createEnemy(){

  const enemy=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1,1.5,.7),
    new THREE.MeshStandardMaterial({color:0xcc2222})
  );

  body.position.y=1.2;
  enemy.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.4,16,16),
    new THREE.MeshStandardMaterial({color:0xffaa88})
  );

  head.position.y=2.25;
  enemy.add(head);

  enemy.position.set(
    (Math.random()-.5)*35,
    0,
    -10-Math.random()*30
  );

  enemy.userData.hp=2;

  scene.add(enemy);
  enemies.push(enemy);
}

/* create enemies */

for(let i=0;i<8;i++){
  createEnemy();
}

/* ---------------- SHOOT ---------------- */

function shoot(){

  if(!gameRunning)return;

  const bullet=new THREE.Mesh(
    new THREE.SphereGeometry(.09,8,8),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );

  bullet.position.copy(camera.position);

  const direction=new THREE.Vector3();

  camera.getWorldDirection(direction);

  bullet.userData.velocity=direction.multiplyScalar(.7);

  scene.add(bullet);
  bullets.push(bullet);
}
