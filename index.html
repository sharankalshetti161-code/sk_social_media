<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#111;
}

header{
  height:64px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#1877f2;
}

.menu{
  font-size:27px;
  cursor:pointer;
}

.container{
  max-width:600px;
  margin:auto;
  padding:22px 16px 40px;
}

.welcome{
  text-align:center;
  padding:25px 10px;
}

.welcome h1{
  font-size:32px;
  margin-bottom:8px;
}

.welcome p{
  color:#666;
  font-size:15px;
}

.apps{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:15px;
}

.app{
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  padding:25px 10px;
  text-align:center;
  text-decoration:none;
  color:#111;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  transition:.2s;
}

.app:active{
  transform:scale(.96);
}

.icon{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  color:white;
}

.instagram .icon{
  background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

.facebook .icon{
  background:#1877f2;
}

.whatsapp .icon{
  background:#25d366;
}

.youtube .icon{
  background:#ff0000;
}

.snapchat .icon{
  background:#ffd600;
  color:#111;
}

.app h2{
  margin-top:12px;
  font-size:18px;
}

.app p{
  margin-top:5px;
  color:#777;
  font-size:12px;
}

footer{
  text-align:center;
  margin-top:35px;
  color:#888;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SK Social</div>
  <div class="menu">☰</div>
</header>

<div class="container">

  <div class="welcome">
    <h1>SK Social</h1>
    <p>All your favourite social platforms in one place</p>
  </div>

  <div class="apps">

    <a class="app instagram"
       href="https://www.instagram.com/"
       target="_blank">
      <div class="icon">◎</div>
      <h2>Instagram</h2>
      <p>Open Instagram</p>
    </a>

    <a class="app facebook"
       href="https://www.facebook.com/"
       target="_blank">
      <div class="icon">f</div>
      <h2>Facebook</h2>
      <p>Open Facebook</p>
    </a>

    <a class="app whatsapp"
       href="https://web.whatsapp.com/"
       target="_blank">
      <div class="icon">☎</div>
      <h2>WhatsApp</h2>
      <p>Open WhatsApp Web</p>
    </a>

    <a class="app youtube"
       href="https://www.youtube.com/"
       target="_blank">
      <div class="icon">▶</div>
      <h2>YouTube</h2>
      <p>Open YouTube</p>
    </a>

    <a class="app snapchat"
       href="https://www.snapchat.com/"
       target="_blank">
      <div class="icon">👻</div>
      <h2>Snapchat</h2>
      <p>Open Snapchat</p>
    </a>

  </div>

  <footer>
    © 2026 SK Social
  </footer>

</div>

</body>
</html>
